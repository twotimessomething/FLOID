    <!-- Theme before the first paint. `useTheme` owns this key and applies the
         same class again once React mounts; doing it here as well means the
         ground is never the wrong colour for a frame — which the splash screen,
         being one flat sheet of that colour, would show plainly. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('floid-theme');
          var isDark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* Storage can be blocked; the default light ground is fine. */
        }
      })();
    </script>

        <p>FLOID is built for anyone planning a product development schedule: product managers, program managers, engineers, industrial designers, and founders. It is ideal for new product development (NPD) where parallel workstreams — engineering, design, tooling, prototyping, testing, marketing, and regulatory — need to stay aligned against shared milestones. And because it is a general-purpose timeline builder at heart, it works just as well for software release plans, marketing campaigns, event schedules, research projects, or any plan that benefits from a visual, multi-track timeline.</p>
