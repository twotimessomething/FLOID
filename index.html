        <h1>FLOID — Free Design Process Scheduling Software for Industrial Designers</h1>
        <p>FLOID is a free, browser-based timeline scheduling tool built for industrial designers and product development teams. No account required, no usage limits, and your data stays in your browser.</p>

        <h2>Features</h2>
        <ul>
          <li>Drag-and-drop timeline scheduling with phases, tasks, and milestones</li>
          <li>Multiple parallel schedule sections per project</li>
          <li>Master schedule sync — lock sections to automatically rescale when the master changes</li>

          <li>Works offline after initial load</li>
        </ul>

        <h2>Who Is FLOID For?</h2>
        <p>FLOID is designed for industrial designers, product development teams, and design managers who need to plan and coordinate multi-workstream project timelines. It is ideal for physical product development where parallel tracks — such as design, engineering, tooling, prototyping, testing, and regulatory — need to stay aligned against a master schedule.</p>

        <h2>Why FLOID?</h2>
        <p>Unlike general-purpose project management tools, FLOID focuses on visual timeline scheduling without the overhead of task assignment, communication, or workflow automation. It is simpler and faster than traditional Gantt chart software, using relative positioning instead of rigid task dependencies. And unlike spreadsheet-based scheduling, FLOID provides a proper drag-and-drop timeline with automatic date calculation and clean export formats.</p>
