[package]
name = "floid"
version = "1.0.0"
description = "FLOID — fluid timelines for product development"
authors = ["Scotty Shu"]
edition = "2021"

[lib]
name = "floid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
