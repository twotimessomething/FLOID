[package]
name = "floid"
version = "1.4.0"
description = "FLOID — fluid timelines for product development"
authors = ["Scotty Shu"]
edition = "2021"

[lib]
name = "floid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = "2"
# 2.5 needs tauri 2.12, and the tauri crate has to match @tauri-apps/api
# minor-for-minor — move this with that pair, not on its own
tauri-plugin-window-state = "~2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL"] }
